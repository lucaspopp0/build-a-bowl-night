name: Deploy site

on:

  push:
    branches:
      - main
    paths:
      - '.github/workflows/deploy-site.yml'
      - 'site/**'

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; let an in-progress deploy finish rather than cancel it
concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:

  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      -
        uses: actions/checkout@v7
      -
        name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6
      -
        uses: actions/setup-node@v7
        with:
          node-version-file: site/package.json
          cache-dependency-path: site/package-lock.json
          cache: npm
      -
        name: Install dependencies
        working-directory: site
        run: npm ci
      -
        name: Build site
        working-directory: site
        env:
          # Project pages are served from /<repo>/, so vite needs the base path
          VITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}/
        run: npm run build
      -
        name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    name: Deploy site
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      -
        name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
