name: deploy (lambda)
run-name: Deploy ${{ github.event.client_payload.tag || inputs.TAG }} to ${{ github.event.client_payload.environment || inputs.ENVIRONMENT }}

on:
  # Triggered by the previous environment's deployment (or the sequence start) through repository_dispatch
  repository_dispatch:
    types:
      - deploy-lambda-prd

  # Manual deploys of a specific tag to a specific environment
  workflow_dispatch:
    inputs:
      COMPONENT:
        description: component
        required: true
        type: string
      ENVIRONMENT:
        description: environment
        required: true
        type: string
      TAG:
        description: tag
        required: true
        type: string
      DISPATCH_NEXT:
        description: dispatch next on success?
        required: true
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

defaults:
  run:
    shell: bash

# Queue deployments of the same type rather than cancelling one that is in flight
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:

  # Reads the component, environment and tag from the dispatch payload or manual inputs, and works out what comes next
  parse-deployment-info:
    runs-on: ubuntu-latest
    outputs:
      COMPONENT: ${{ steps.deployment-info.outputs.COMPONENT }}
      ENVIRONMENT: ${{ steps.deployment-info.outputs.ENVIRONMENT }}
      TAG: ${{ steps.deployment-info.outputs.TAG }}
      SEQUENCE_DONE: ${{ steps.parse-deployment-sequence.outputs.DONE }}
      NEXT_ENVIRONMENT: ${{ steps.parse-deployment-sequence.outputs.NEXT_ENVIRONMENT }}
    steps:
      -
        uses: actions/checkout@v6
      -
        name: Parse repository_dispatch payload
        id: parse-dispatch-event
        if: ${{ github.event_name == 'repository_dispatch' }}
        uses: slingshot-pipelines/action-deployment-sequence/parse-dispatch-event@v0
        with:
          CLIENT_PAYLOAD: ${{ toJSON(github.event.client_payload) }}
      -
        name: Consolidate deployment info
        id: deployment-info
        env:
          DISPATCH_COMPONENT: ${{ steps.parse-dispatch-event.outputs.COMPONENT }}
          DISPATCH_ENVIRONMENT: ${{ steps.parse-dispatch-event.outputs.ENVIRONMENT }}
          DISPATCH_TAG: ${{ steps.parse-dispatch-event.outputs.TAG }}
          INPUT_COMPONENT: ${{ inputs.COMPONENT }}
          INPUT_ENVIRONMENT: ${{ inputs.ENVIRONMENT }}
          INPUT_TAG: ${{ inputs.TAG }}
        run: |
          # Prefer the dispatch payload, falling back to manual workflow inputs
          {
            echo "COMPONENT=${DISPATCH_COMPONENT:-$INPUT_COMPONENT}"
            echo "ENVIRONMENT=${DISPATCH_ENVIRONMENT:-$INPUT_ENVIRONMENT}"
            echo "TAG=${DISPATCH_TAG:-$INPUT_TAG}"
          } | tee -a "$GITHUB_OUTPUT"
      -
        name: Parse deployment sequence
        id: parse-deployment-sequence
        uses: slingshot-pipelines/action-deployment-sequence/parse-sequence@v0
        with:
          COMPONENT: ${{ steps.deployment-info.outputs.COMPONENT }}
          PREVIOUS_ENVIRONMENT: ${{ steps.deployment-info.outputs.ENVIRONMENT }}

  deploy:
    needs:
      - parse-deployment-info
    uses: slingshot-pipelines/workflows/.github/workflows/deploy-lambda.yml@deploy-lambda/v1
    with:
      COMPONENT: ${{ needs.parse-deployment-info.outputs.COMPONENT }}
      ENVIRONMENT: ${{ needs.parse-deployment-info.outputs.ENVIRONMENT }}
      TAG: ${{ needs.parse-deployment-info.outputs.TAG }}
      TERRAFORM_VERSION: latest
      TERRAGRUNT_VERSION: latest
    secrets: inherit

  # Once the last environment succeeds, the prerelease becomes a full release
  release:
    needs:
      - parse-deployment-info
      - deploy
    if: ${{ needs.parse-deployment-info.outputs.SEQUENCE_DONE == 'true' }}
    runs-on: ubuntu-latest
    steps:
      -
        uses: actions/checkout@v6
      -
        uses: slingshot-pipelines/action-promote-prerelease@v0
        with:
          TAG: ${{ needs.parse-deployment-info.outputs.TAG }}

  # Otherwise, kick off the next environment (skipped for manual runs unless DISPATCH_NEXT is set)
  dispatch-next:
    needs:
      - parse-deployment-info
      - deploy
    if: ${{ needs.parse-deployment-info.outputs.SEQUENCE_DONE == 'false' && !(github.event_name == 'workflow_dispatch' && inputs.DISPATCH_NEXT == false) }}
    runs-on: ubuntu-latest
    steps:
      -
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.parse-deployment-info.outputs.TAG }}
      -
        uses: slingshot-pipelines/action-deployment-sequence/dispatch-next@v0
        with:
          COMPONENT: ${{ needs.parse-deployment-info.outputs.COMPONENT }}
          TAG: ${{ needs.parse-deployment-info.outputs.TAG }}
          NEXT_ENVIRONMENT: ${{ needs.parse-deployment-info.outputs.NEXT_ENVIRONMENT }}
