components:
  schemas:
    CreateIngredientInputBody:
      additionalProperties: false
      properties:
        category:
          description: Kind of ingredient, such as protein or topping
          maxLength: 100
          minLength: 1
          type: string
        name:
          description: What is being brought
          maxLength: 200
          minLength: 1
          type: string
      required:
        - category
        - name
      type: object
    ErrorDetail:
      additionalProperties: false
      properties:
        location:
          description: Where the error occurred, e.g. 'body.items[3].tags' or 'path.thing-id'
          type: string
        message:
          description: Error message text
          type: string
        value:
          description: The value at the given location
      type: object
    ErrorModel:
      additionalProperties: false
      properties:
        detail:
          description: A human-readable explanation specific to this occurrence of the problem.
          examples:
            - Property foo is required but is missing.
          type: string
        errors:
          description: Optional list of individual error details
          items:
            $ref: "#/components/schemas/ErrorDetail"
          type:
            - array
            - "null"
        instance:
          description: A URI reference that identifies the specific occurrence of the problem.
          examples:
            - https://example.com/error-log/abc123
          format: uri
          type: string
        status:
          description: HTTP status code
          examples:
            - 400
          format: int64
          type: integer
        title:
          description: A short, human-readable summary of the problem type. This value should not change between occurrences of the error.
          examples:
            - Bad Request
          type: string
        type:
          default: about:blank
          description: A URI reference to human-readable documentation for the error.
          examples:
            - https://example.com/errors/example
          format: uri
          type: string
      type: object
    HealthOutputBody:
      additionalProperties: false
      properties:
        status:
          description: Always ok when the API is reachable
          examples:
            - ok
          type: string
      required:
        - status
      type: object
    Ingredient:
      additionalProperties: false
      properties:
        category:
          description: Kind of ingredient, such as protein or topping
          type: string
        id:
          description: Identifier of the ingredient, unique within its user
          type: string
        name:
          description: What is being brought
          type: string
        user:
          description: Phone number of the owning user
          type: string
      required:
        - user
        - id
        - category
        - name
      type: object
    IngredientsOutputBody:
      additionalProperties: false
      properties:
        ingredients:
          items:
            $ref: "#/components/schemas/Ingredient"
          type:
            - array
            - "null"
      required:
        - ingredients
      type: object
    PutIngredientInputBody:
      additionalProperties: false
      properties:
        category:
          description: Kind of ingredient, such as protein or topping
          maxLength: 100
          minLength: 1
          type: string
        name:
          description: What is being brought
          maxLength: 200
          minLength: 1
          type: string
      required:
        - category
        - name
      type: object
    PutUserInputBody:
      additionalProperties: false
      properties:
        name:
          description: Display name
          maxLength: 200
          minLength: 1
          type: string
      required:
        - name
      type: object
    User:
      additionalProperties: false
      properties:
        name:
          description: Display name
          type: string
        phone:
          description: Phone number the guest identifies themselves with
          type: string
      required:
        - phone
        - name
      type: object
    UsersOutputBody:
      additionalProperties: false
      properties:
        users:
          items:
            $ref: "#/components/schemas/User"
          type:
            - array
            - "null"
      required:
        - users
      type: object
info:
  title: Build-a-Bowl Night API
  version: 1.0.0
openapi: 3.1.0
paths:
  /health:
    get:
      operationId: health
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Health check
      tags:
        - Health
  /ingredients:
    get:
      operationId: list-ingredients
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngredientsOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List all ingredients
      tags:
        - Ingredients
  /users:
    get:
      operationId: list-users
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsersOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List users
      tags:
        - Users
  /users/{phone}:
    delete:
      operationId: delete-user
      parameters:
        - description: Phone number of the user
          in: path
          name: phone
          required: true
          schema:
            description: Phone number of the user
            maxLength: 32
            minLength: 1
            type: string
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Delete a user and their ingredients
      tags:
        - Users
    get:
      operationId: get-user
      parameters:
        - description: Phone number of the user
          in: path
          name: phone
          required: true
          schema:
            description: Phone number of the user
            maxLength: 32
            minLength: 1
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Get a user
      tags:
        - Users
    put:
      operationId: put-user
      parameters:
        - description: Phone number of the user
          in: path
          name: phone
          required: true
          schema:
            description: Phone number of the user
            maxLength: 32
            minLength: 1
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PutUserInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Create or update a user
      tags:
        - Users
  /users/{phone}/ingredients:
    get:
      operationId: list-user-ingredients
      parameters:
        - description: Phone number of the user
          in: path
          name: phone
          required: true
          schema:
            description: Phone number of the user
            maxLength: 32
            minLength: 1
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngredientsOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List a user's ingredients
      tags:
        - Ingredients
    post:
      operationId: create-ingredient
      parameters:
        - description: Phone number of the user
          in: path
          name: phone
          required: true
          schema:
            description: Phone number of the user
            maxLength: 32
            minLength: 1
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateIngredientInputBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ingredient"
          description: Created
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      summary: Create an ingredient
      tags:
        - Ingredients
  /users/{phone}/ingredients/{id}:
    delete:
      operationId: delete-ingredient
      parameters:
        - description: Phone number of the user
          in: path
          name: phone
          required: true
          schema:
            description: Phone number of the user
            maxLength: 32
            minLength: 1
            type: string
        - description: Identifier of the ingredient, chosen by the client
          in: path
          name: id
          required: true
          schema:
            description: Identifier of the ingredient, chosen by the client
            maxLength: 64
            minLength: 1
            type: string
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Delete an ingredient
      tags:
        - Ingredients
    get:
      operationId: get-ingredient
      parameters:
        - description: Phone number of the user
          in: path
          name: phone
          required: true
          schema:
            description: Phone number of the user
            maxLength: 32
            minLength: 1
            type: string
        - description: Identifier of the ingredient, chosen by the client
          in: path
          name: id
          required: true
          schema:
            description: Identifier of the ingredient, chosen by the client
            maxLength: 64
            minLength: 1
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ingredient"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Get an ingredient
      tags:
        - Ingredients
    put:
      operationId: put-ingredient
      parameters:
        - description: Phone number of the user
          in: path
          name: phone
          required: true
          schema:
            description: Phone number of the user
            maxLength: 32
            minLength: 1
            type: string
        - description: Identifier of the ingredient, chosen by the client
          in: path
          name: id
          required: true
          schema:
            description: Identifier of the ingredient, chosen by the client
            maxLength: 64
            minLength: 1
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PutIngredientInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ingredient"
          description: OK
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      summary: Create or update an ingredient
      tags:
        - Ingredients

